[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --html=reports/test_report.html
    --self-contained-html
markers =
    web: Web UI tests driven by Selenium WebDriver
    mobile: Mobile tests driven by Appium (Android)
    api: REST and WebSocket API tests
    smoke: Fast sanity and smoke tests
    regression: Comprehensive full regression suite
    performance: Resource consumption and memory leak tests
    testrail: TestRail integration case tracking (e.g. @pytest.mark.testrail(101))
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
