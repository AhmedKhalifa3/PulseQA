[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",  # Line too long
    "UP035", # Generator import deprecation in typing
    "F401",  # Unused imports in __init__
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = [
    "api",
    "core",
    "integrations",
    "pages",
    "security_compliance",
    "target_app",
    "telemetry",
    "tests",
]

